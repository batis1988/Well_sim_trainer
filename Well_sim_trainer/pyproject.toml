[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "well-sim-trainer"
version = "0.1.0"
description = "Цифровой тренажер поведения добывающих и нагнетательных скважин"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Your Name", email = "your@email.com"},
]

# === Основные зависимости (Phase 0) ===
dependencies = [
    "numpy>=2.0,<3",
    "scipy>=1.14,<2",
    "pint>=0.24",           # Конвертация единиц (не изобретайте свой units.py!)
    "thermo>=0.5",          # PVT, фазовые равновесия, гидраты
    "lasio>=0.31",          # Чтение LAS-файлов
    "pandas>=3.0"
]

# === Опциональные группы зависимостей ===
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.0",      # Property-based testing для физики
    "ruff>=0.8",            # Linter + formatter (заменяет black+isort+flake8)
    "mypy>=1.13",           # Type checking
    "pre-commit>=4.0",
]
ui = [
    "panel>=1.6",
    "holoviews>=1.20",
    "bokeh>=3.6",
    "pyvista>=0.44",        # 3D визуализация
    "jupyterlab>=4.3",      # Для notebooks верификации
]
all = ["well-sim-trainer[dev,ui]"]

# === Настройки инструментов ===
[tool.hatch.build.targets.wheel]
packages = ["src/well_sim"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"